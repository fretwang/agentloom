[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloom"
version = "0.1.0"
description = "A small, dependable framework for building tool-using LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wangyuanbo" }]
keywords = ["llm", "agent", "ai-agents", "tool-calling", "function-calling", "mcp", "structured-output", "claude", "openai", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fretwang/agentloom"
Documentation = "https://github.com/fretwang/agentloom/blob/main/docs/en/guide.md"
Issues = "https://github.com/fretwang/agentloom/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
mcp = ["mcp>=2.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "pydantic>=2",
    "anthropic>=1.0",
    "openai>=1.40",
    "mcp>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentloom = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agentloom"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "mcp", "mcp.*"]
ignore_missing_imports = true
