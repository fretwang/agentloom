name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      description: A ScriptedProvider script that shows the problem is ideal, because it runs without an API key.
      render: python
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Error output or trace
      description: >
        The traceback, or the JSONL trace from hooks=[JsonlTracer("run.jsonl")].
        Traces contain prompts and tool data: remove secrets before pasting.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: agentloom version or commit, Python version, and the provider SDK version (anthropic / openai / mcp).
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: For example "OpenAIProvider, deepseek-chat at api.deepseek.com".
