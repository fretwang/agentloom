name: Feature request
description: Suggest something agentloom should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build, and what gets in the way?
      description: The use case matters more than the proposed API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A sketch of how you would want to call it is enough.
      render: python
  - type: dropdown
    id: where
    attributes:
      label: Where do you think it belongs?
      description: The core stays small and dependency-free; most additions fit behind one of the four seams.
      options:
        - A new provider
        - A new session store
        - A new context strategy
        - A hook or tracer
        - The core loop or tools
        - An example or template
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself
